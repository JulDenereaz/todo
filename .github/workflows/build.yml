name: Build & Push

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Bump version
        if: "!contains(github.event.head_commit.message, '[skip ci]')"
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "previous_tag=${PREV_TAG}" >> $GITHUB_OUTPUT
          if echo "${{ github.event.head_commit.message }}" | grep -q "\[minor\]"; then
            npm version minor --no-git-tag-version
          else
            npm version patch --no-git-tag-version
          fi
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          git add package.json package-lock.json
          git commit -m "chore: bump version [skip ci]"
          git tag "v${VERSION}"
          git push
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        if: "!contains(github.event.head_commit.message, '[skip ci]')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG="${{ steps.bump.outputs.previous_tag }}"
          RANGE="${PREV_TAG:+${PREV_TAG}..}HEAD"
          NOTES=$(git log "$RANGE" --no-merges --invert-grep --grep="^chore: bump version" --pretty=format:"- %s (%h)")
          if [ -z "$NOTES" ]; then
            NOTES="No notable changes."
          fi
          gh release create "${{ steps.bump.outputs.version }}" \
            --title "${{ steps.bump.outputs.version }}" \
            --notes "$NOTES"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/juldenereaz/todo
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
